name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
      - name: Test
        run: go test ./...

  release:
    name: release binaries
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
      - name: Cross-compile
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          version="${GITHUB_REF_NAME#v}"
          build() {
            CGO_ENABLED=0 GOOS="$1" GOARCH="$2" \
              go build -trimpath -ldflags "-s -w -X main.version=${version}" \
              -o "dist/$3" .
          }
          build windows amd64 niagara-git-windows-amd64.exe
          build linux amd64 niagara-git-linux-amd64
          build linux arm64 niagara-git-linux-arm64
          build darwin arm64 niagara-git-darwin-arm64
          build darwin amd64 niagara-git-darwin-amd64
      - name: Attach binaries to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          notes="Single-file niagara-git binaries. No runtime to install. See the README for install.sh and install.ps1."
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/* --clobber
          else
            gh release create "$tag" dist/* --title "$tag" --notes "$notes"
          fi
